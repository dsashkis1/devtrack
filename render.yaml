services:
  - type: web
    name: devtrack
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: DEBUG
        value: false
      - key: DB_PATH
        value: /opt/render/project/src/devtrack.db
